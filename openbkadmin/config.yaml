---
name: OpenBKAdmin
version: "0.5.1"
slug: openbkadmin
description: Centrally manage OpenBeken devices
url: "https://github.com/cyberrep/hassio-openbkadmin"
webui: "[PROTO:ssl]://[HOST]:[PORT:9542]"
startup: system
init: false
arch:
  - aarch64
  - amd64
map:
  - ssl
ports:
  9542/tcp: 9542
ports_description:
  9542/tcp: OpenBKAdmin web interface
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
