worker_processes  1;
pid /var/run/nginx.pid;
user nginx nginx;

events {
    worker_connections  1024;
}

http {
    include            mime.types;
    default_type       application/octet-stream;
    sendfile           on;
    keepalive_timeout  65;

    server {
        server_name hassio.local;
        listen 9542 default_server;
        root /var/www/openbkadmin/;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Keep the existing HTML favicon paths, but serve the OpenBKAdmin icon.
        # no-store prevents browsers from keeping the old TasmoAdmin favicon.
        location = /resources/img/favicons/favicon-32x32.png {
            add_header Cache-Control "no-store, max-age=0";
            try_files /resources/img/openbkadmin-icon.png =404;
        }
        location = /resources/img/favicons/favicon-16x16.png {
            add_header Cache-Control "no-store, max-age=0";
            try_files /resources/img/openbkadmin-icon.png =404;
        }
        location = /resources/img/favicons/apple-touch-icon.png {
            add_header Cache-Control "no-store, max-age=0";
            try_files /resources/img/openbkadmin-icon.png =404;
        }
        location = /favicon.ico {
            add_header Cache-Control "no-store, max-age=0";
            try_files /resources/img/openbkadmin-icon.png =404;
        }

        location /data/firmwares {
            add_header Access-Control-Allow-Origin *;
        }

        location /data/ {
            deny all;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_read_timeout 900;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ ^(.*)\.(css|js|gif||jpe?g|png|json|cache\.json)$ {
        }
    }
}
